name: Generate Safe Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [run-playlist]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      env:
        PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
      run: |
        if [ -z "$PLAYLIST_URL" ]; then
          echo "::error::PLAYLIST_URL secret is not defined or empty!"
          exit 1
        fi
        python3 generator.py

    - name: Delete old workflow runs to save storage
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 0
        keep_minimum_runs: 1

    - name: Commit and push always
      run: |
        if [ ! -f "Rexz.m3u" ]; then
          echo "::error::Rexz.m3u was not generated by generator.py"
          exit 1
        fi

        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add Rexz.m3u
        
        if git diff --staged --quiet; then
          echo "No changes to commit in Rexz.m3u"
        else
          git commit -m "Update Rexz.m3u [skip ci]"
          git pull --rebase origin main || git pull --rebase origin master || true
          git push origin HEAD:main || git push origin HEAD:master || true
        fi
