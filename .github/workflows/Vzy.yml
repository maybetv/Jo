name: Safely Update VZY United Sports Exact Match

on:
  schedule:
    # ഓരോ മണിക്കൂറിലും 23-ാം മിനിറ്റിൽ റൺ ആകുന്നു
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vzy-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update United Sports
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          source_url = "https://raw.githubusercontent.com/maybetv/Jo/refs/heads/main/plex.m3u"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              print(f"Fetching playlist from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}")
              exit(1)

          def parse_m3u_blocks(content):
              blocks = []
              curr = []
              for line in content.splitlines():
                  l = line.strip()
                  if not l:
                      continue
                  if l.startswith("#EXTINF:"):
                      if curr:
                          blocks.append(curr)
                      curr = [line]
                  elif curr:
                      curr.append(line)
              if curr:
                  blocks.append(curr)
              return blocks

          source_blocks = parse_m3u_blocks(source_text)
          print(f"സോഴ്സിൽ ആകെ കണ്ടെത്തിയ ചാനലുകൾ: {len(source_blocks)}")

          us1_block = None
          us2_block = None

          def normalize(text):
              return re.sub(r'[^A-Z0-9]', '', text.upper())

          # സോഴ്സിൽ നിന്ന് Sports 1, Sports 2 ബ്ലോക്കുകൾ വേർതിരിക്കുന്നു
          for block in source_blocks:
              header = block[0]
              clean_name = normalize(header)
              full_text = "\n".join(block)

              # Sports 1 (tvg-id 9624886 അല്ലെങ്കിൽ Unite8 Sports 1)
              if not us1_block:
                  if '9624886' in header or "UNITE8SPORTS1" in clean_name or ("UNITE8" in clean_name and "1" in clean_name) or "Unite8_Sports_1_HD.mpd" in full_text:
                      us1_block = block
                      print(f"✅ സോഴ്സിൽ Sports 1 കണ്ടെത്തി: {block[0]}")
                      continue

              # Sports 2 (tvg-id 9624884 അല്ലെങ്കിൽ Unite8 Sports 2)
              if not us2_block:
                  if '9624884' in header or "UNITE8SPORTS2" in clean_name or ("UNITE8" in clean_name and "2" in clean_name) or "Unite8_Sports_2_HD.mpd" in full_text:
                      us2_block = block
                      print(f"✅ സോഴ്സിൽ Sports 2 കണ്ടെത്തി: {block[0]}")
                      continue

          if not us1_block or not us2_block:
              print("ERROR: സോഴ്സ് ഫയലിൽ ആവശ്യമായ ചാനലുകൾ കണ്ടെത്താനായില്ല!")
              exit(1)

          # നിലവിലെ Zoh.m3u ഫയൽ ഇല്ലെങ്കിൽ പുതിയത് ഉണ്ടാക്കുന്നു
          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല, പുതിയ ഫയൽ നിർമ്മിക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  f.write("\n".join(us1_block) + "\n")
                  f.write("\n".join(us2_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_text = f.read()

          target_blocks = parse_m3u_blocks(target_text)
          updated_blocks = []
          sports_inserted = False

          def is_corrupted_or_sports(block):
              txt = "\n".join(block).upper()
              if '9624886' in txt or '9624884' in txt:
                  return True
              if 'UNITE8' in txt or 'UNITED8' in txt:
                  return True
              if 'UNITE8_SPORTS' in txt:
                  return True
              return False

          # Zoh.m3u ഫയലിലെ കേടായ/പഴയ എൻട്രികൾ മാറ്റി കൃത്യമായി 1-ഉം 2-ഉം ഇൻസേർട്ട് ചെയ്യുന്നു
          for block in target_blocks:
              if is_corrupted_or_sports(block):
                  # ആദ്യത്തെ Unite8 കാണുന്ന ഭാഗത്ത് കൃത്യമായി രണ്ട് ചാനലുകളും വെവ്വേറെ ചേർക്കുന്നു
                  if not sports_inserted:
                      print("🔄 Zoh.m3u-ൽ Sports 1 ഉം Sports 2 ഉം വെവ്വേറെ ബ്ലോക്കുകളായി ചേർക്കുന്നു...")
                      updated_blocks.append(us1_block)
                      updated_blocks.append(us2_block)
                      sports_inserted = True
                  # പഴയ തെറ്റായതോ ഇരട്ടിച്ചതോ ആയ എൻട്രികൾ ഒഴിവാക്കുന്നു
              else:
                  # മറ്റെല്ലാ ചാനലുകളും അതേപടി നിലനിർത്തുന്നു
                  updated_blocks.append(block)

          # മുൻപ് ഫയലിൽ ഇല്ലാതിരുന്നെങ്കിൽ അവസാനം ചേർക്കുന്നു
          if not sports_inserted:
              print("➕ Zoh.m3u-ൽ മുൻപ് ഇല്ലാതിരുന്നതിനാൽ അവസാനം ചേർക്കുന്നു.")
              updated_blocks.append(us1_block)
              updated_blocks.append(us2_block)

          # ഫയൽ സുരക്ഷിതമായി സേവ് ചെയ്യുന്നു
          with open(target_file, "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              for b in updated_blocks:
                  f.write("\n".join(b) + "\n")

          print("🎉 Zoh.m3u ഫയൽ വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git diff --staged --quiet; then
            echo "ലിങ്കുകളിൽ യാതൊരു മാറ്റവുമില്ല."
          else
            git commit -m "Fix Unite8 Sports 1 & 2 layout and update streams [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "പുതിയ മാറ്റങ്ങൾ GitHub-ലേക്ക് പുഷ് ചെയ്തു!"
          fi
