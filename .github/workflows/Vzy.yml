name: Safely Update VZY United Sports Exact Match

on:
  schedule:
    # ട്രാഫിക് ഒഴിവാക്കാൻ ഓരോ മണിക്കൂറിലും 23-ാമത്തെ മിനിറ്റിൽ റൺ ആകുന്നു
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vzy-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update United Sports
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          source_url = "https://premiumplugx.me/vzy/playlist.php"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              print(f"Fetching updates from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}. Zoh.m3u ഫയലിൽ മാറ്റമില്ലാതെ നിർത്തുന്നു.")
              exit(0)

          source_lines = source_text.splitlines()
          all_blocks = []
          curr = []

          for line in source_lines:
              l = line.strip()
              if not l:
                  continue
              if l.startswith("#EXTINF:"):
                  if curr:
                      all_blocks.append(curr)
                  curr = [line]
              elif curr:
                  curr.append(line)
          if curr:
              all_blocks.append(curr)

          print(f"സോഴ്സിൽ ആകെ {len(all_blocks)} ചാനലുകൾ കണ്ടെത്തി.")

          def identify_channel(block):
              content = "\n".join(block).upper()
              
              if '9624886' in content or ('UNITE8' in content and 'SPORTS 1' in content):
                  return 1
              if ('UNITED' in content or 'UNITE8' in content) and 'SPORTS' in content and re.search(r'\b(1|ONE)\b', content):
                  return 1

              if '9624884' in content or ('UNITE8' in content and 'SPORTS 2' in content):
                  return 2
              if ('UNITED' in content or 'UNITE8' in content) and 'SPORTS' in content and re.search(r'\b(2|TWO)\b', content):
                  return 2

              return None

          us1_block = None
          us2_block = None

          for block in all_blocks:
              ch_type = identify_channel(block)
              if ch_type == 1 and not us1_block:
                  us1_block = block
              elif ch_type == 2 and not us2_block:
                  us2_block = block

          if not us1_block and not us2_block:
              print("Warning: സോഴ്സിൽ United/Unite8 Sports ചാനലുകൾ കണ്ടെത്താനായില്ല. ഫയലിൽ മാറ്റം വരുത്തുന്നില്ല.")
              exit(0)

          print(f"കണ്ടെത്തിയ ചാനലുകൾ: United 1: {'ഉണ്ട്' if us1_block else 'ഇല്ല'}, United 2: {'ഉണ്ട്' if us2_block else 'ഇല്ല'}")

          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല. പുതിയതായി ഉണ്ടാക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  if us1_block:
                      f.write("\n".join(us1_block) + "\n")
                  if us2_block:
                      f.write("\n".join(us2_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_lines = f.read().splitlines()

          output_lines = []
          i = 0
          us1_replaced = False
          us2_replaced = False

          while i < len(target_lines):
              line = target_lines[i]
              stripped = line.strip()

              if stripped.startswith("#EXTINF:"):
                  current_block = [line]
                  j = i + 1
                  while j < len(target_lines) and not target_lines[j].strip().startswith("#EXTINF:"):
                      current_block.append(target_lines[j])
                      j += 1

                  ch_type = identify_channel(current_block)

                  if ch_type == 1 and us1_block:
                      print("Zoh.m3u-ലെ പഴയ United Sports 1 മാറ്റി പുതിയത് വെക്കുന്നു...")
                      output_lines.extend(us1_block)
                      us1_replaced = True
                      i = j
                      continue
                  elif ch_type == 2 and us2_block:
                      print("Zoh.m3u-ലെ പഴയ United Sports 2 മാറ്റി പുതിയത് വെക്കുന്നു...")
                      output_lines.extend(us2_block)
                      us2_replaced = True
                      i = j
                      continue

              output_lines.append(line)
              i += 1

          if us1_block and not us1_replaced:
              output_lines.extend(us1_block)

          if us2_block and not us2_replaced:
              output_lines.extend(us2_block)

          with open(target_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")

          print(f"{target_file} സുരക്ഷിതമായി അപ്ഡേറ്റ് ചെയ്തു!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git status --porcelain | grep -q 'Zoh.m3u'; then
            git commit -m "Auto-update VZY United Sports 1 & 2 in Zoh.m3u [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated and pushed."
          else
            echo "No changes detected. Zoh.m3u is up-to-date."
          fi
