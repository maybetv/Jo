name: Safely Update VZY United Sports Exact Match

on:
  schedule:
    # ഓരോ മണിക്കൂറിലും 23-ാം മിനിറ്റിൽ റൺ ആകുന്നു
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vzy-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update United Sports
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          source_url = "https://raw.githubusercontent.com/maybetv/Jo/refs/heads/main/plex.m3u"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              print(f"Fetching playlist from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}")
              exit(1)

          def parse_m3u_blocks(content):
              blocks = []
              curr = []
              for line in content.splitlines():
                  l = line.strip()
                  if not l:
                      continue
                  if l.startswith("#EXTINF:"):
                      if curr:
                          blocks.append(curr)
                      curr = [line]
                  elif curr:
                      curr.append(line)
              if curr:
                  blocks.append(curr)
              return blocks

          source_blocks = parse_m3u_blocks(source_text)
          print(f"സോഴ്സിൽ ആകെ കണ്ടെത്തിയ ചാനലുകൾ: {len(source_blocks)}")

          us1_block = None
          us2_block = None

          def normalize(text):
              return re.sub(r'[^A-Z0-9]', '', text.upper())

          # ലെവൽ 1: കൃത്യമായ പേര് പരിശോധിക്കുന്നു (Unite8 Sports 1 HD & 2 HD)
          for block in source_blocks:
              clean_name = normalize(block[0])
              if not us1_block and "UNITE8SPORTS1HD" in clean_name:
                  us1_block = block
                  print(f"✅ Exact Match കണ്ടെത്തി (Sports 1): {block[0]}")
              elif not us2_block and "UNITE8SPORTS2HD" in clean_name:
                  us2_block = block
                  print(f"✅ Exact Match കണ്ടെത്തി (Sports 2): {block[0]}")

          # ലെവൽ 2: മുകളിൽ പറഞ്ഞ രീതിയിൽ കിട്ടിയില്ലെങ്കിൽ മാത്രം 'UNITE8' / 'UNITED8' വെച്ച് നോക്കുന്നു
          if not us1_block or not us2_block:
              print("Exact match ലഭിക്കാത്തതിനാൽ Unite8 കീവേഡ് വെച്ച് പരിശോധിക്കുന്നു...")
              for block in source_blocks:
                  clean_name = normalize(block[0])
                  
                  # UNITE8 അല്ലെങ്കിൽ UNITED8 വരുന്നുണ്ടോ എന്ന് നോക്കുന്നു
                  if "UNITE8" in clean_name or "UNITED8" in clean_name:
                      if not us1_block and ("1HD" in clean_name or "1" in clean_name):
                          us1_block = block
                          print(f"✅ Unite8 Match വഴി കണ്ടെത്തി (Sports 1): {block[0]}")
                      elif not us2_block and ("2HD" in clean_name or "2" in clean_name):
                          us2_block = block
                          print(f"✅ Unite8 Match വഴി കണ്ടെത്തി (Sports 2): {block[0]}")

          if not us1_block and not us2_block:
              print("ERROR: സോഴ്സിൽ പറഞ്ഞ ചാനലുകൾ കണ്ടെത്താനായില്ല!")
              exit(1)

          # നിലവിലെ Zoh.m3u ഫയൽ ഇല്ലെങ്കിൽ പുതിയത് ഉണ്ടാക്കുന്നു
          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല, പുതിയ ഫയൽ നിർമ്മിക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  if us1_block:
                      f.write("\n".join(us1_block) + "\n")
                  if us2_block:
                      f.write("\n".join(us2_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_text = f.read()

          target_blocks = parse_m3u_blocks(target_text)
          updated_blocks = []
          us1_replaced = False
          us2_replaced = False

          def match_target(block):
              clean_name = normalize(block[0])
              is_ch1 = ("UNITE8SPORTS1" in clean_name) or (("UNITE8" in clean_name or "UNITED8" in clean_name) and "1" in clean_name)
              is_ch2 = ("UNITE8SPORTS2" in clean_name) or (("UNITE8" in clean_name or "UNITED8" in clean_name) and "2" in clean_name)
              return is_ch1, is_ch2

          # Zoh.m3u-ൽ ഉള്ള മറ്റ് എല്ലാ ചാനലുകളെയും അങ്ങനെ തന്നെ വെച്ച്, ഈ 2 ചാനലുകൾ മാത്രം മാറ്റുന്നു
          for block in target_blocks:
              is_ch1, is_ch2 = match_target(block)
              if is_ch1 and us1_block:
                  print("🔄 Zoh.m3u-ലെ പഴയ Sports 1 മാറ്റി പുതിയ ബ്ലോക്ക് ചേർക്കുന്നു...")
                  updated_blocks.append(us1_block)
                  us1_replaced = True
              elif is_ch2 and us2_block:
                  print("🔄 Zoh.m3u-ലെ പഴയ Sports 2 മാറ്റി പുതിയ ബ്ലോക്ക് ചേർക്കുന്നു...")
                  updated_blocks.append(us2_block)
                  us2_replaced = True
              else:
                  # മറ്റ് എല്ലാ ചാനലുകളും ഒരു മാറ്റവുമില്ലാതെ ലിസ്റ്റിൽ നിലനിർത്തുന്നു
                  updated_blocks.append(block)

          # Zoh.m3u-ൽ മുൻപ് ഇവ ഇല്ലായിരുന്നു എങ്കിൽ മാത്രം അവസാനം ചേർക്കുന്നു
          if us1_block and not us1_replaced:
              print("➕ Zoh.m3u-ൽ മുൻപ് ഇല്ലാതിരുന്നതിനാൽ Sports 1 ചേർക്കുന്നു.")
              updated_blocks.append(us1_block)

          if us2_block and not us2_replaced:
              print("➕ Zoh.m3u-ൽ മുൻപ് ഇല്ലാതിരുന്നതിനാൽ Sports 2 ചേർക്കുന്നു.")
              updated_blocks.append(us2_block)

          # പൂർണ്ണമായും സേഫായി ഫയൽ വീണ്ടും എഴുതുന്നു
          with open(target_file, "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              for b in updated_blocks:
                  f.write("\n".join(b) + "\n")

          print("🎉 Zoh.m3u ഫയൽ സുരക്ഷിതമായി അപ്ഡേറ്റ് ചെയ്തു!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git diff --staged --quiet; then
            echo "ലിങ്കുകളിൽ യാതൊരു മാറ്റവുമില്ല. Zoh.m3u നിലവിൽ അപ്ഡേറ്റഡ് ആണ്."
          else
            git commit -m "Auto-update Unite8 Sports 1 & 2 [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "പുതിയ ലിങ്കുകൾ GitHub-ലേക്ക് പുഷ് ചെയ്തു!"
          fi
