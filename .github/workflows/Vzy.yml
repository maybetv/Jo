name: Safely Update VZY United Sports Exact Match

on:
  schedule:
    # ഓരോ മണിക്കൂറിലും 23-ാം മിനിറ്റിൽ റൺ ആകുന്നു
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vzy-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update United Sports
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          source_url = "https://raw.githubusercontent.com/maybetv/Jo/refs/heads/main/plex.m3u"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              print(f"Fetching playlist from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}")
              exit(1)

          def parse_m3u_blocks(content):
              blocks = []
              curr = []
              for line in content.splitlines():
                  l = line.strip()
                  if not l:
                      continue
                  if l.startswith("#EXTINF:"):
                      if curr:
                          blocks.append(curr)
                      curr = [line]
                  elif curr:
                      curr.append(line)
              if curr:
                  blocks.append(curr)
              return blocks

          source_blocks = parse_m3u_blocks(source_text)
          print(f"സോഴ്സിൽ ആകെ കണ്ടെത്തിയ ചാനലുകൾ: {len(source_blocks)}")

          us1_block = None
          us2_block = None

          def normalize(text):
              return re.sub(r'[^A-Z0-9]', '', text.upper())

          # സോഴ്സിൽ നിന്ന് കൃത്യമായ tvg-id അല്ലെങ്കിൽ പേര് വെച്ച് കണ്ടുപിടിക്കുന്നു
          for block in source_blocks:
              extinf = block[0]
              clean_name = normalize(extinf)

              # Sports 1 (tvg-id: 9624886)
              if not us1_block:
                  if '9624886' in extinf or "UNITE8SPORTS1" in clean_name or ("UNITE8" in clean_name and "1" in clean_name):
                      us1_block = block
                      print(f"✅ Source-ൽ Sports 1 കണ്ടെത്തി: {block[0]}")
                      continue

              # Sports 2 (tvg-id: 9624884)
              if not us2_block:
                  if '9624884' in extinf or "UNITE8SPORTS2" in clean_name or ("UNITE8" in clean_name and "2" in clean_name):
                      us2_block = block
                      print(f"✅ Source-ൽ Sports 2 കണ്ടെത്തി: {block[0]}")
                      continue

          if not us1_block or not us2_block:
              print("Warning: ഒന്നോ അതിലധികമോ ചാനൽ കണ്ടെത്താൻ കഴിഞ്ഞില്ല.")

          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല, പുതിയത് ഉണ്ടാക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  if us1_block: f.write("\n".join(us1_block) + "\n")
                  if us2_block: f.write("\n".join(us2_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_text = f.read()

          target_blocks = parse_m3u_blocks(target_text)
          updated_blocks = []
          
          sports1_done = False
          sports2_done = False

          def is_target_sports_block(extinf):
              clean = normalize(extinf)
              if '9624886' in extinf or '9624884' in extinf:
                  return True
              if "UNITE8" in clean or "UNITED8" in clean or ("SPORTS" in clean and ("UNITE" in clean or "UNITED" in clean)):
                  if "1" in clean or "2" in clean:
                      return True
              return False

          for block in target_blocks:
              extinf = block[0]
              if is_target_sports_block(extinf):
                  # ആദ്യത്തെ സ്ലോട്ടിൽ Sports 1 റീപ്ലേസ് ചെയ്യുന്നു
                  if not sports1_done and us1_block:
                      print("🔄 Zoh.m3u-ലെ ആദ്യ സ്ഥാനത്ത് Sports 1 ചേർത്തു.")
                      updated_blocks.append(us1_block)
                      sports1_done = True
                  # രണ്ടാമത്തെ സ്ലോട്ടിൽ Sports 2 റീപ്ലേസ് ചെയ്യുന്നു (ഡ്യൂപ്ലിക്കേഷൻ പൂർണ്ണമായി ഒഴിവാക്കുന്നു)
                  elif not sports2_done and us2_block:
                      print("🔄 Zoh.m3u-ലെ രണ്ടാമത്തെ സ്ഥാനത്ത് Sports 2 ചേർത്തു.")
                      updated_blocks.append(us2_block)
                      sports2_done = True
                  else:
                      # അധികമായി വരുന്ന ഡ്യൂപ്ലിക്കേറ്റുകൾ ഒഴിവാക്കുന്നു
                      print("🗑️ അധികമായി കണ്ട ഡ്യൂപ്ലിക്കേറ്റ് ഒഴിവാക്കി.")
              else:
                  # ബാക്കി എല്ലാ ചാനലുകളും അതേപടി നിലനിർത്തുന്നു
                  updated_blocks.append(block)

          # ഫയലിൽ ഇതിൽ ഏതെങ്കിലും ഒരെണ്ണം വിട്ടുപോയിട്ടുണ്ടെങ്കിൽ മാത്രം അവസാനം ചേർക്കുന്നു
          if us1_block and not sports1_done:
              updated_blocks.append(us1_block)
          if us2_block and not sports2_done:
              updated_blocks.append(us2_block)

          with open(target_file, "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              for b in updated_blocks:
                  f.write("\n".join(b) + "\n")

          print("🎉 Zoh.m3u വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു (Sports 1 ഉം 2 ഉം കൃത്യമായി വേർതിരിച്ചു)!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git diff --staged --quiet; then
            echo "ലിങ്കുകളിൽ മാറ്റമില്ല."
          else
            git commit -m "Fix duplicate Unite8 Sports: Set Sports 1 and Sports 2 separately [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "പുതിയ ലിങ്കുകൾ GitHub-ലേക്ക് പുഷ് ചെയ്തു!"
          fi
