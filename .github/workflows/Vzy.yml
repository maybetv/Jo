name: Safely Update VZY United Sports Exact Match

on:
  schedule:
    # ട്രാഫിക് കുറഞ്ഞ സമയത്ത് (ഓരോ മണിക്കൂറിലും 23-ാം മിനിറ്റിൽ)
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vzy-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update United Sports
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          source_url = "https://raw.githubusercontent.com/maybetv/Jo/refs/heads/main/plex.m3u"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              print(f"Fetching playlist from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}")
              exit(1)

          source_lines = source_text.splitlines()
          all_blocks = []
          curr = []

          for line in source_lines:
              l = line.strip()
              if not l:
                  continue
              if l.startswith("#EXTINF:"):
                  if curr:
                      all_blocks.append(curr)
                  curr = [line]
              elif curr:
                  curr.append(line)
          if curr:
              all_blocks.append(curr)

          print(f"സോഴ്സിൽ ആകെ കണ്ടെത്തിയ ചാനലുകൾ: {len(all_blocks)}")

          us1_block = None
          us2_block = None

          # റഫറൻസ് പ്രകാരമുള്ള tvg-id അല്ലെങ്കിൽ Unite8/United Sports മാച്ച് ചെയ്യുന്നു
          for block in all_blocks:
              full_block_text = "\n".join(block)
              header = block[0].upper()

              # Unite8 Sports 1 (tvg-id="9624886")
              if '9624886' in full_block_text or (('UNITED' in header or 'UNITE8' in header or 'UNITE' in header) and 'SPORTS' in header and re.search(r'\b(1|ONE)\b', header)):
                  if not us1_block:
                      us1_block = block
                      print(f"United Sports 1 കണ്ടെത്തി: {block[0]}")

              # Unite8 Sports 2 (tvg-id="9624884")
              elif '9624884' in full_block_text or (('UNITED' in header or 'UNITE8' in header or 'UNITE' in header) and 'SPORTS' in header and re.search(r'\b(2|TWO)\b', header)):
                  if not us2_block:
                      us2_block = block
                      print(f"United Sports 2 കണ്ടെത്തി: {block[0]}")

          if not us1_block and not us2_block:
              print("ERROR: സോഴ്സിൽ United/Unite8 Sports ചാനലുകൾ കണ്ടെത്താനായില്ല!")
              exit(1)

          # നിലവിലെ ഫയൽ പരിശോധിക്കുന്നു
          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല, പുതിയ ഫയൽ നിർമ്മിക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  if us1_block:
                      f.write("\n".join(us1_block) + "\n")
                  if us2_block:
                      f.write("\n".join(us2_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_lines = f.read().splitlines()

          output_lines = []
          i = 0
          us1_replaced = False
          us2_replaced = False

          def match_target(line_str):
              txt = line_str.upper()
              is_ch1 = '9624886' in txt or (('UNITED' in txt or 'UNITE8' in txt or 'UNITE' in txt) and 'SPORTS' in txt and re.search(r'\b(1|ONE)\b', txt))
              is_ch2 = '9624884' in txt or (('UNITED' in txt or 'UNITE8' in txt or 'UNITE' in txt) and 'SPORTS' in txt and re.search(r'\b(2|TWO)\b', txt))
              return is_ch1, is_ch2

          # Zoh.m3u-ലെ പഴയ ലിങ്കുകൾ മാറ്റി പുതിയ ബ്ലോക്ക് കൃത്യമായി ചേർക്കുന്നു
          while i < len(target_lines):
              line = target_lines[i]
              stripped = line.strip()

              if stripped.startswith("#EXTINF:"):
                  is_ch1, is_ch2 = match_target(stripped)

                  if is_ch1 and us1_block:
                      print("Zoh.m3u-ലെ പഴയ Sports 1 മാറ്റി പുതിയ ബ്ലോക്ക് ചേർക്കുന്നു...")
                      output_lines.extend(us1_block)
                      us1_replaced = True
                      i += 1
                      while i < len(target_lines) and not target_lines[i].strip().startswith("#EXTINF:"):
                          i += 1
                      continue

                  elif is_ch2 and us2_block:
                      print("Zoh.m3u-ലെ പഴയ Sports 2 മാറ്റി പുതിയ ബ്ലോക്ക് ചേർക്കുന്നു...")
                      output_lines.extend(us2_block)
                      us2_replaced = True
                      i += 1
                      while i < len(target_lines) and not target_lines[i].strip().startswith("#EXTINF:"):
                          i += 1
                      continue

              output_lines.append(line)
              i += 1

          # ടാർഗെറ്റ് ഫയലിൽ മുൻപ് ഇവ ഇല്ലെങ്കിൽ അവസാനം ചേർക്കുന്നു
          if us1_block and not us1_replaced:
              print("ഫയലിൽ മുൻപ് ഇല്ലാതിരുന്നതിനാൽ Sports 1 ചേർക്കുന്നു.")
              output_lines.extend(us1_block)

          if us2_block and not us2_replaced:
              print("ഫയലിൽ മുൻപ് ഇല്ലാതിരുന്നതിനാൽ Sports 2 ചേർക്കുന്നു.")
              output_lines.extend(us2_block)

          with open(target_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")

          print("Zoh.m3u ഫയൽ വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git diff --staged --quiet; then
            echo "ലിങ്കുകളിൽ യാതൊരു മാറ്റവുമില്ല. Zoh.m3u നിലവിൽ അപ്ഡേറ്റഡ് ആണ്."
          else
            git commit -m "Auto-update VZY United Sports 1 & 2 in Zoh.m3u [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "പുതിയ ലിങ്കുകൾ GitHub-ലേക്ക് പുഷ് ചെയ്തു!"
          fi
