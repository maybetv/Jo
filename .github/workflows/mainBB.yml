name: Safely Update BB Malayalam Every 5 Minutes

on:
  workflow_dispatch:

  schedule:
    # Workflow starts every hour.
    # The job itself performs the update every 5 minutes.
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: bb-malayalam-updater
  cancel-in-progress: false

jobs:
  update-bbm:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update BB Malayalam Every 5 Minutes
        env:
          SOURCE_URL: "https://premiumplugx.com/jhsevents/liveevents.php?action=refresh"
          TARGET_FILE: "Zoh.m3u"
        run: |
          cat > update_bbm.py <<'PY'
          import os
          import time
          import requests

          SOURCE_URL = os.environ["SOURCE_URL"]
          TARGET_FILE = os.environ["TARGET_FILE"]

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }


          def download_source():
              try:
                  # Cache-busting parameter
                  url = SOURCE_URL

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      params={
                          "_cb": str(int(time.time()))
                      },
                      timeout=40
                  )

                  response.raise_for_status()

                  if not response.text.strip():
                      print("Source returned empty response.")
                      return None

                  return response.text

              except Exception as e:
                  print(f"Source download error: {e}")
                  return None


          def parse_blocks(text):
              blocks = []
              current = []

              for line in text.splitlines():
                  line = line.rstrip()

                  if not line.strip():
                      continue

                  if line.strip().startswith("#EXTINF:"):
                      if current:
                          blocks.append(current)

                      current = [line]

                  elif current:
                      current.append(line)

              if current:
                  blocks.append(current)

              return blocks


          def find_bb_malayalam(blocks):
              for block in blocks:
                  text = "\n".join(block).upper()

                  if "MALAYALAM" not in text:
                      continue

                  keywords = [
                      "BIGG BOSS",
                      "BIGGBOSS",
                      "BBS",
                      "BBM",
                      "BB:"
                  ]

                  if any(keyword in text for keyword in keywords):
                      return block

              return None


          def is_bb_malayalam(line):
              text = line.upper()

              if "MALAYALAM" not in text:
                  return False

              keywords = [
                  "BIGG BOSS",
                  "BIGGBOSS",
                  "BBS",
                  "BBM",
                  "BB:"
              ]

              return any(keyword in text for keyword in keywords)


          def update_playlist():
              print("Downloading source...")

              source_text = download_source()

              if source_text is None:
                  return False

              source_blocks = parse_blocks(source_text)

              print(
                  f"Source playlist blocks found: "
                  f"{len(source_blocks)}"
              )

              bb_block = find_bb_malayalam(source_blocks)

              if not bb_block:
                  print("BB Malayalam not found in source.")
                  return False

              print("BB Malayalam found in source.")

              if not os.path.exists(TARGET_FILE):
                  print(
                      f"{TARGET_FILE} does not exist. "
                      "Nothing will be created."
                  )
                  return False

              with open(
                  TARGET_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  old_text = f.read()

              old_lines = old_text.splitlines()

              new_lines = []

              i = 0
              replaced = False

              while i < len(old_lines):

                  line = old_lines[i]

                  if line.strip().startswith("#EXTINF:"):

                      if is_bb_malayalam(line):

                          print(
                              "Existing BB Malayalam block found."
                          )

                          new_lines.extend(bb_block)

                          replaced = True

                          # Skip complete old block
                          i += 1

                          while (
                              i < len(old_lines)
                              and not old_lines[i]
                              .strip()
                              .startswith("#EXTINF:")
                          ):
                              i += 1

                          continue

                  new_lines.append(line)

                  i += 1

              # IMPORTANT:
              # Never add a new BB Malayalam entry if it
              # wasn't already present in Zoh.m3u.
              if not replaced:
                  print(
                      "BB Malayalam entry does not exist "
                      "in Zoh.m3u."
                  )
                  print("No changes made.")
                  return False

              new_text = "\n".join(new_lines).rstrip() + "\n"

              if new_text == old_text:
                  print("No playlist change detected.")
                  return False

              with open(
                  TARGET_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(new_text)

              print("Zoh.m3u successfully updated.")
              return True


          if __name__ == "__main__":
              update_playlist()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in {1..11}
          do
            echo ""
            echo "=========================================="
            echo "UPDATE $i / 11"
            echo "TIME: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=========================================="

            python update_bbm.py

            echo ""
            echo "Checking Git changes..."

            git add Zoh.m3u

            if ! git diff --cached --quiet; then

              echo "Playlist changed."

              git commit -m "Auto-update BB Malayalam [skip ci]"

              echo "Syncing with remote..."

              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase failed. Resetting to remote and retrying."

                git rebase --abort || true

                git reset --soft origin/main

                if ! git diff --cached --quiet; then
                  git commit -m "Auto-update BB Malayalam [skip ci]"
                fi
              fi

              echo "Pushing changes..."

              PUSH_SUCCESS=false

              for retry in {1..3}
              do
                if git push origin HEAD:main; then
                  echo "Push successful."
                  PUSH_SUCCESS=true
                  break
                fi

                echo "Push failed. Retry $retry/3..."

                sleep 10

                git fetch origin main

                git rebase origin/main || true
              done

              if [ "$PUSH_SUCCESS" = false ]; then
                echo "ERROR: Could not push changes."
                exit 1
              fi

            else
              echo "No changes detected."
            fi

            if [ "$i" -lt 11 ]; then
              echo ""
              echo "Waiting exactly 5 minutes..."
              sleep 300
            fi
          done
