name: Safely Update Only BB Malayalam in Zoh.m3u

on:
  schedule:
    # കൃത്യമായി ഓരോ 1 മണിക്കൂർ കൂടുമ്പോഴും റൺ ആവാൻ
    - cron: '0 * * * *'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാൻ

permissions:
  contents: write

jobs:
  update-bbm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Safely Update BB Malayalam
        run: |
          python - << 'EOF'
          import os
          import requests

          source_url = "https://premiumplugx.com/jhsevents/liveevents.php?action=refresh"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          # 1. സോഴ്സ് ലിങ്കിൽ നിന്ന് ഡാറ്റ ഡൗൺലോഡ് ചെയ്യുന്നു
          try:
              print(f"Fetching from source: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=30)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error fetching source: {e}. Zoh.m3u-ൽ മാറ്റമൊന്നും വരുത്താതെ നിർത്തുന്നു.")
              exit(0)

          # 2. സോഴ്സിലെ എല്ലാ ചാനൽ ബ്ലോക്കുകളും വേർതിരിക്കുന്നു
          source_lines = source_text.splitlines()
          all_blocks = []
          curr = []

          for line in source_lines:
              stripped = line.strip()
              if not stripped:
                  continue
              if stripped.startswith("#EXTINF:"):
                  if curr:
                      all_blocks.append(curr)
                  curr = [stripped]
              elif curr:
                  curr.append(stripped)
          if curr:
              all_blocks.append(curr)

          print(f"സോഴ്സ് ലിങ്കിൽ ആകെ {len(all_blocks)} ചാനലുകൾ കണ്ടെത്തി.")

          # Step A: ആദ്യം 'BB' അല്ലെങ്കിൽ 'BBS' അല്ലെങ്കിൽ 'BIGG BOSS' ഉള്ള ലിങ്കുകൾ മാത്രം കണ്ടെത്തുന്നു
          bb_candidates = []
          for block in all_blocks:
              combined_text = " ".join(block).upper()
              if ("BIGG BOSS" in combined_text) or ("BIGGBOSS" in combined_text) or ("BBS" in combined_text) or (" BB " in combined_text) or ("BB:" in combined_text) or ("BBM" in combined_text):
                  bb_candidates.append(block)

          print(f"ഇതിൽ Bigg Boss (BB) അടങ്ങിയ {len(bb_candidates)} ലിങ്കുകൾ കണ്ടെത്തി.")

          # Step B: ആ ബിബി ലിങ്കുകളിൽ നിന്ന് 'MALAYALAM' ഉള്ളത് മാത്രം കൃത്യമായി ഫിൽട്ടർ ചെയ്യുന്നു
          malayalam_bb_block = None
          for block in bb_candidates:
              combined_text = " ".join(block).upper()
              if "MALAYALAM" in combined_text:
                  malayalam_bb_block = block
                  break

          if not malayalam_bb_block:
              print("Warning: ബിബി ലിങ്കുകളിൽ 'MALAYALAM' കണ്ടെത്താൻ കഴിഞ്ഞില്ല. സുരക്ഷയ്ക്കായി Zoh.m3u-ൽ മാറ്റം വരുത്തുന്നില്ല.")
              exit(0)

          print(f"BB MALAYALAM ലിങ്ക് കൃത്യമായി കണ്ടെത്തി ({len(malayalam_bb_block)} വരികൾ).")

          # 3. നിലവിലുള്ള Zoh.m3u ഫയൽ വായിക്കുന്നു
          if not os.path.exists(target_file):
              print(f"{target_file} നിലവിലില്ല, പുതിയ ഫയൽ ഉണ്ടാക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(malayalam_bb_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_lines = f.read().splitlines()

          # 4. Zoh.m3u-ലെ മറ്റ് ഒരു ലിങ്കിനും കേടുപാട് വരാതെ BB Malayalam മാത്രം റീപ്ലേസ് ചെയ്യുന്നു
          output_lines = []
          i = 0
          bb_replaced = False

          while i < len(target_lines):
              line = target_lines[i]
              stripped = line.strip()

              if stripped.startswith("#EXTINF:"):
                  upper_l = stripped.upper()
                  is_existing_bbm = ("MALAYALAM" in upper_l) and (("BBS" in upper_l) or ("BIGG BOSS" in upper_l) or ("BIGGBOSS" in upper_l) or ("BB" in upper_l))

                  if is_existing_bbm:
                      print("നിലവിലെ Zoh.m3u-ലെ പഴയ BB Malayalam കണ്ടെത്തി, അത് മാത്രം പുതിയ ലിങ്ക് വെച്ച് മാറ്റുന്നു...")
                      output_lines.extend(malayalam_bb_block)
                      bb_replaced = True
                      i += 1
                      while i < len(target_lines) and not target_lines[i].strip().startswith("#EXTINF:"):
                          i += 1
                      continue

              # ബാക്കി മുഴുവൻ ചാനലുകളും അതേപടി നിലനിർത്തുന്നു
              output_lines.append(line)
              i += 1

          if not bb_replaced:
              print("ഫയലിൽ മുൻപ് BB Malayalam ഉണ്ടായിരുന്നില്ല, ലിസ്റ്റിന്റെ അവസാനം ചേർക്കുന്നു.")
              output_lines.extend(malayalam_bb_block)

          # 5. അപ്ഡേറ്റ് ചെയ്ത ഫയൽ സേവ് ചെയ്യുന്നു
          with open(target_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")

          print(f"{target_file} പൂർണ്ണ സുരക്ഷിതമായി അപ്ഡേറ്റ് ചെയ്തു. ബാക്കി ലിങ്കുകൾക്ക് ഒന്നും സംഭവിച്ചിട്ടില്ല.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git status --porcelain | grep -q 'Zoh.m3u'; then
            git commit -m "Safely updated BB Malayalam in Zoh.m3u [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully pushed updates."
          else
            echo "No changes found. Zoh.m3u is up-to-date."
          fi
