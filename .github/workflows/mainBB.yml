name: Safely Update BB Malayalam Exact Match

on:
  schedule:
    # ഓരോ 5 മിനിറ്റിലും റൺ ചെയ്യാൻ (ബാക്കപ്പ് ഷെഡ്യൂൾ)
    - cron: '*/5 * * * *'
  workflow_dispatch: # cron-job.org വഴി റൺ ചെയ്യാൻ ഇത് നിർബന്ധമാണ്

permissions:
  contents: write

jobs:
  update-bbm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Exact Match Update BB Malayalam
        run: |
          python - << 'EOF'
          import os
          import requests

          source_url = "https://premiumplugx.com/jhsevents/liveevents.php?action=refresh"
          target_file = "Zoh.m3u"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          # 1. സോഴ്സ് ലിങ്കിൽ നിന്ന് ഡാറ്റ ഡൗൺലോഡ് ചെയ്യുന്നു
          try:
              print(f"Fetching updates from: {source_url}")
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}. Zoh.m3u-ൽ മാറ്റമില്ലാതെ നിർത്തുന്നു.")
              exit(0)

          # 2. സോഴ്സ് കണ്ടന്റിലെ ചാനൽ ബ്ലോക്കുകൾ വേർതിരിക്കുന്നു
          source_lines = source_text.splitlines()
          all_blocks = []
          curr = []

          for line in source_lines:
              l = line.strip()
              if not l:
                  continue
              if l.startswith("#EXTINF:"):
                  if curr:
                      all_blocks.append(curr)
                  curr = [line]
              elif curr:
                  curr.append(line)
          if curr:
              all_blocks.append(curr)

          print(f"സോഴ്സിൽ ആകെ {len(all_blocks)} ചാനലുകൾ കണ്ടെത്തി.")

          # Step A: Bigg Boss (BB/BBS/BIGG BOSS) ബ്ലോക്കുകൾ കണ്ടെത്തുന്നു
          bb_candidates = []
          for block in all_blocks:
              block_str = "\n".join(block).upper()
              if any(key in block_str for key in ["BIGG BOSS", "BIGGBOSS", "BBS", " BB ", "BB:", "BBM"]):
                  bb_candidates.append(block)

          # Step B: അതിൽ നിന്ന് 'MALAYALAM' ഉള്ള ബ്ലോക്ക് കൃത്യമായി കണ്ടെത്തുന്നു
          malayalam_block = None
          for block in bb_candidates:
              block_str = "\n".join(block).upper()
              if "MALAYALAM" in block_str:
                  malayalam_block = block
                  break

          if not malayalam_block:
              print("Warning: സോഴ്സിൽ BB Malayalam കണ്ടെത്താനായില്ല. ഫയലിൽ മാറ്റം വരുത്തുന്നില്ല.")
              exit(0)

          print("BB Malayalam ബ്ലോക്ക് വിജയകരമായി കണ്ടെത്തി.")

          # 3. നിലവിലെ Zoh.m3u ഫയൽ വായിക്കുന്നു
          if not os.path.exists(target_file):
              print(f"{target_file} കാണാനില്ല. പുതിയതായി ഉണ്ടാക്കുന്നു.")
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(malayalam_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_lines = f.read().splitlines()

          # 4. മറ്റ് ലിങ്കുകൾക്ക് ഡാമേജ് വരാതെ BB Malayalam മാത്രം റീപ്ലേസ് ചെയ്യുന്നു
          output_lines = []
          i = 0
          bb_replaced = False

          while i < len(target_lines):
              line = target_lines[i]
              stripped = line.strip()

              if stripped.startswith("#EXTINF:"):
                  upper_l = stripped.upper()
                  is_bbm = ("MALAYALAM" in upper_l) and any(k in upper_l for k in ["BBS", "BIGG BOSS", "BIGGBOSS", "BB"])

                  if is_bbm:
                      print("നിലവിലെ Zoh.m3u-ലെ പഴയ BB Malayalam ലൈൻ മാറ്റി പുതിയത് വെക്കുന്നു...")
                      output_lines.extend(malayalam_block)
                      bb_replaced = True
                      i += 1
                      # പഴയ ചാനലിന്റെ URL, മറ്റ് വരികൾ ഒഴിവാക്കുന്നു
                      while i < len(target_lines) and not target_lines[i].strip().startswith("#EXTINF:"):
                          i += 1
                      continue

              output_lines.append(line)
              i += 1

          if not bb_replaced:
              print("ഫയലിൽ മുൻപ് BB Malayalam ഉണ്ടായിരുന്നില്ല, അവസാനം ചേർക്കുന്നു.")
              output_lines.extend(malayalam_block)

          # 5. ഫയൽ സേവ് ചെയ്യുന്നു
          with open(target_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")

          print(f"{target_file} സുരക്ഷിതമായി അപ്ഡേറ്റ് ചെയ്തു!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Zoh.m3u
          if git status --porcelain | grep -q 'Zoh.m3u'; then
            git commit -m "Auto-update BB Malayalam in Zoh.m3u [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully updated and pushed."
          else
            echo "No changes detected. Zoh.m3u is up-to-date."
          fi
