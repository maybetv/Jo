name: BB Malayalam Update Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bb-malayalam-update
  cancel-in-progress: false

jobs:
  update-bbm:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update BB Malayalam
        env:
          SOURCE_URL: "https://premiumplugx.com/jhsevents/liveevents.php?action=refresh"
          TARGET_FILE: "Zoh.m3u"
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          SOURCE_URL = os.environ["SOURCE_URL"]
          TARGET_FILE = os.environ["TARGET_FILE"]

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          print("Downloading source playlist...")

          try:
              response = requests.get(
                  SOURCE_URL,
                  headers=HEADERS,
                  params={"_": int(time.time())},
                  timeout=40
              )

              response.raise_for_status()
              source_text = response.text

          except Exception as e:
              print(f"Source download failed: {e}")
              raise SystemExit(1)

          if not source_text.strip():
              print("Source playlist is empty.")
              raise SystemExit(1)

          # --------------------------------
          # Parse M3U blocks
          # --------------------------------

          def get_blocks(text):
              blocks = []
              current = []

              for line in text.splitlines():
                  line = line.rstrip()

                  if not line.strip():
                      continue

                  if line.strip().startswith("#EXTINF:"):
                      if current:
                          blocks.append(current)

                      current = [line]

                  elif current:
                      current.append(line)

              if current:
                  blocks.append(current)

              return blocks

          source_blocks = get_blocks(source_text)

          print(
              f"Source blocks found: {len(source_blocks)}"
          )

          # --------------------------------
          # Find BB Malayalam
          # --------------------------------

          bb_block = None

          for block in source_blocks:

              block_text = "\n".join(block).upper()

              if "MALAYALAM" not in block_text:
                  continue

              if any(
                  keyword in block_text
                  for keyword in [
                      "BIGG BOSS",
                      "BIGGBOSS",
                      "BBS",
                      "BBM",
                      "BB:"
                  ]
              ):
                  bb_block = block
                  break

          if not bb_block:
              print("BB Malayalam not found.")
              raise SystemExit(0)

          print("BB Malayalam found.")

          # --------------------------------
          # Read existing playlist
          # --------------------------------

          if not os.path.exists(TARGET_FILE):
              print(f"{TARGET_FILE} not found.")
              raise SystemExit(1)

          with open(
              TARGET_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              old_text = f.read()

          old_lines = old_text.splitlines()

          # --------------------------------
          # Identify existing BB Malayalam
          # --------------------------------

          def is_bb_malayalam(line):

              text = line.upper()

              if "MALAYALAM" not in text:
                  return False

              return any(
                  keyword in text
                  for keyword in [
                      "BIGG BOSS",
                      "BIGGBOSS",
                      "BBS",
                      "BBM",
                      "BB:"
                  ]
              )

          # --------------------------------
          # Replace complete existing block
          # --------------------------------

          new_lines = []

          i = 0
          replaced = False

          while i < len(old_lines):

              line = old_lines[i]

              if line.strip().startswith("#EXTINF:"):

                  if is_bb_malayalam(line):

                      print(
                          "Existing BB Malayalam block found."
                      )

                      # Replace COMPLETE block
                      new_lines.extend(bb_block)

                      replaced = True

                      i += 1

                      # Skip old block
                      while (
                          i < len(old_lines)
                          and not old_lines[i]
                          .strip()
                          .startswith("#EXTINF:")
                      ):
                          i += 1

                      continue

              new_lines.append(line)
              i += 1

          # --------------------------------
          # Do NOT add new channel
          # --------------------------------

          if not replaced:

              print(
                  "BB Malayalam is not present "
                  "in Zoh.m3u."
              )

              print(
                  "No new entry will be added."
              )

              raise SystemExit(0)

          # --------------------------------
          # Compare
          # --------------------------------

          new_text = (
              "\n".join(new_lines).rstrip()
              + "\n"
          )

          if new_text == old_text:

              print(
                  "BB Malayalam has no changes."
              )

              raise SystemExit(0)

          # --------------------------------
          # Write updated playlist
          # --------------------------------

          with open(
              TARGET_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(new_text)

          print(
              "BB Malayalam updated successfully."
          )
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Zoh.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto-update BB Malayalam [skip ci]"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
