name: Safely Update BB Malayalam Every 5 Minutes

on:
  schedule:
    # ഓരോ 50 മിനിറ്റിലോ 1 മണിക്കൂറിലോ ട്രിഗർ ചെയ്യുക
    - cron: '*/50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bbm:
    runs-on: ubuntu-latest
    timeout-minutes: 55 # 50 മിനിറ്റ് കഴിഞ്ഞ് അടുത്ത ജോബ് വരും

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Script Every 5 Minutes in a Loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 50 മിനിറ്റിൽ ആകെ 10 തവണ (ഓരോ 5 മിനിറ്റിലും) റൺ ചെയ്യും
          for i in {1..10}
          do
            echo "Iteration $i starting at $(date)..."
            
            python - << 'EOF'
          import os
          import requests

          source_url = "https://premiumplugx.com/jhsevents/liveevents.php?action=refresh"
          target_file = "Zoh.m3u"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          try:
              res = requests.get(source_url, headers=headers, timeout=40)
              res.raise_for_status()
              source_text = res.text
          except Exception as e:
              print(f"Error downloading source: {e}")
              exit(0)

          source_lines = source_text.splitlines()
          all_blocks, curr = [], []
          for line in source_lines:
              l = line.strip()
              if not l: continue
              if l.startswith("#EXTINF:"):
                  if curr: all_blocks.append(curr)
                  curr = [line]
              elif curr:
                  curr.append(line)
          if curr: all_blocks.append(curr)

          bb_candidates = [b for b in all_blocks if any(k in "\n".join(b).upper() for k in ["BIGG BOSS", "BIGGBOSS", "BBS", " BB ", "BB:", "BBM"])]
          malayalam_block = next((b for b in bb_candidates if "MALAYALAM" in "\n".join(b).upper()), None)

          if not malayalam_block:
              print("Warning: BB Malayalam not found.")
              exit(0)

          if not os.path.exists(target_file):
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(malayalam_block) + "\n")
              exit(0)

          with open(target_file, "r", encoding="utf-8") as f:
              target_lines = f.read().splitlines()

          output_lines = []
          i = 0
          bb_replaced = False
          while i < len(target_lines):
              line = target_lines[i]
              stripped = line.strip()
              if stripped.startswith("#EXTINF:"):
                  upper_l = stripped.upper()
                  if ("MALAYALAM" in upper_l) and any(k in upper_l for k in ["BBS", "BIGG BOSS", "BIGGBOSS", "BB"]):
                      output_lines.extend(malayalam_block)
                      bb_replaced = True
                      i += 1
                      while i < len(target_lines) and not target_lines[i].strip().startswith("#EXTINF:"):
                          i += 1
                      continue
              output_lines.append(line)
              i += 1

          if not bb_replaced:
              output_lines.extend(malayalam_block)

          with open(target_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")
          EOF

            # മാറ്റങ്ങൾ ഉണ്ടെങ്കിൽ മാത്രം പുഷ് ചെയ്യുക
            git add Zoh.m3u
            if git status --porcelain | grep -q 'Zoh.m3u'; then
              git commit -m "Auto-update BB Malayalam [skip ci]"
              git pull --rebase origin main || true
              git push origin main || true
              echo "Updated and pushed."
            else
              echo "No changes detected."
            fi

            # കൃത്യം 5 മിനിറ്റ് (300 സെക്കൻഡ്) കാത്തിരിക്കുന്നു
            echo "Waiting 5 minutes before next check..."
            sleep 300
          done
