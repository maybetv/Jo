name: Full Sync & Fix M3U Playlist

on:
  schedule:
    # ഓരോ 30 മിനിറ്റിലും റൺ ചെയ്യും
    - cron: '*/30 * * * *'
  workflow_dispatch: # മാനുവലായി റൺ ചെയ്യാനുള്ള ഓപ്ഷൻ

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl_cffi

      - name: Fetch and Process PHP Playlist
        run: |
          python - << 'EOF'
          import gzip
          import zlib
          import sys
          from curl_cffi import requests

          url = "https://premiumplugx.me/vzy/playlist.php"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://premiumplugx.me/",
              "Sec-Ch-Ua": '"Chromium";v="124", "Google Chrome";v="124", "Not-A.Brand";v="99"',
              "Sec-Ch-Ua-Mobile": "?0",
              "Sec-Ch-Ua-Platform": '"Windows"',
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "same-origin"
          }

          try:
              # impersonate="chrome124" ഉപയോഗിച്ച് Cloudflare/WAF ബൈപാസ് ചെയ്യാൻ സഹായിക്കുന്നു
              session = requests.Session(impersonate="chrome124")
              response = session.get(url, headers=headers, allow_redirects=True, timeout=30)
              
              if response.status_code != 200:
                  print(f"Failed to fetch. HTTP Status: {response.status_code}")
                  print(f"Response preview: {response.text[:300]}")
                  sys.exit(1)

              raw_data = response.content

              # Gzip / Zlib വഴി കംപ്രസ് ചെയ്തതാണോ എന്ന് പരിശോധിച്ച് ഡീകോഡ് ചെയ്യുന്നു
              content = ""
              try:
                  content = gzip.decompress(raw_data).decode("utf-8", errors="ignore")
              except Exception:
                  try:
                      content = zlib.decompress(raw_data, 16 + zlib.MAX_WBITS).decode("utf-8", errors="ignore")
                  except Exception:
                      content = raw_data.decode("utf-8", errors="ignore")

              content = content.strip()

              # പ്ലേലിസ്റ്റ് സാധുവാണോ എന്ന് പരിശോധിക്കുന്നു
              if "#EXTM3U" not in content and "#EXTINF" not in content:
                  print("Warning: Response does not look like a valid M3U playlist!")
                  print("First 200 characters of response:")
                  print(content[:200])
                  sys.exit(1)

              # plex.m3u ലേക്ക് സേവ് ചെയ്യുന്നു
              with open("plex.m3u", "w", encoding="utf-8") as f:
                  f.write(content)

              print("Success: Playlist successfully decompressed, verified and saved to plex.m3u!")

          except Exception as e:
              print(f"Error occurred: {e}")
              sys.exit(1)
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plex.m3u
          
          if git diff --staged --quiet; then
            echo "No changes found in playlist. Skipping push."
          else
            echo "Changes detected, pushing new playlist..."
            git commit -m "Auto-update plex.m3u with verified streams [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
