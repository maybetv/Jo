name: Full Sync & Fix M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Sync and Integrate Matching Channels
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import time
          from playwright.sync_api import sync_playwright

          SOURCE_URL = "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u"
          TARGET_FILE = "plex.m3u"

          # 1. Playwright വഴി സോഴ്സ് ഡാറ്റ Cloudflare മറികടന്ന് പൂർണ്ണമായി എടുക്കുന്നു
          raw_source_data = ""
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-blink-features=AutomationControlled", "--no-sandbox"]
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()
              print("[*] Fetching source playlist...")
              try:
                  page.goto(SOURCE_URL, timeout=60000, wait_until="networkidle")
              except Exception as e:
                  print(f"Navigation info: {e}")

              for _ in range(25):
                  page_content = page.content()
                  if "Just a moment..." not in page_content and ("#EXTM3U" in page_content or "#EXTINF" in page_content):
                      break
                  time.sleep(1)

              try:
                  text_content = page.inner_text("body")
                  if "#EXTM3U" in text_content or "#EXTINF" in text_content:
                      raw_source_data = text_content
                  else:
                      raw_source_data = page.content()
              except Exception:
                  raw_source_data = page.content()

              browser.close()

          if "#EXTM3U" not in raw_source_data and "#EXTINF" not in raw_source_data:
              print("[-] Error: Cloudflare bypass failed or empty source response.")
              sys.exit(1)

          # 2. സോഴ്സ് പ്ലേലിസ്റ്റിലെ ഓരോ ചാനൽ ബ്ലോക്കും Parse ചെയ്ത് tvg-id മാപ്പ് ഉണ്ടാക്കുന്നു
          source_lines = raw_source_data.splitlines()
          source_channel_map = {}
          
          current_props = []
          i = 0
          while i < len(source_lines):
              line = source_lines[i].strip()
              if not line or line.startswith("#EXTM3U"):
                  i += 1
                  continue

              if line.startswith("#KODIPROP:"):
                  current_props.append(line)
              elif line.startswith("#EXTINF"):
                  extinf_line = line
                  tid_match = re.search(r'tvg-id="([^"]+)"', extinf_line)
                  channel_id = tid_match.group(1).strip() if tid_match else None
                  
                  # ചാനലിന് ശേഷമുള്ള EXTVLCOPT അല്ലെങ്കിൽ സ്ട്രീം URL കണ്ടെത്തുന്നു
                  following_lines = []
                  j = i + 1
                  while j < len(source_lines):
                      sub = source_lines[j].strip()
                      if sub.startswith("#EXTINF") or sub.startswith("#KODIPROP:"):
                          break
                      if sub:
                          following_lines.append(sub)
                      j += 1
                  
                  if channel_id:
                      # പൂർണ്ണമായ ചാനൽ ബ്ലോക്ക് രൂപീകരിക്കുന്നു (KODIPROP + EXTINF + EXTVLCOPT + URL)
                      full_block = current_props + [extinf_line] + following_lines
                      source_channel_map[channel_id] = "\n".join(full_block)

                  current_props = []
                  i = j - 1
              else:
                  current_props = []
              i += 1

          print(f"[*] Extracted {len(source_channel_map)} channels from source.")

          # 3. ടാർഗെറ്റ് ഫയൽ (plex.m3u) വായിച്ച്, നിലവിലുള്ള മറ്റ് ചാനലുകൾക്ക് കോട്ടം തട്ടാതെ മാച്ചിങ് ചാനലുകൾ മാത്രം മാറ്റുന്നു
          if not os.path.exists(TARGET_FILE):
              print(f"[-] Target file {TARGET_FILE} not found. Creating new file with source data.")
              with open(TARGET_FILE, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(source_channel_map.values()))
              sys.exit(0)

          with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
              target_lines = f.read().splitlines()

          updated_blocks = []
          t_props = []
          k = 0
          replaced_count = 0

          while k < len(target_lines):
              t_line = target_lines[k].strip()
              if not t_line or t_line.startswith("#EXTM3U"):
                  k += 1
                  continue

              if t_line.startswith("#KODIPROP:"):
                  t_props.append(t_line)
              elif t_line.startswith("#EXTINF"):
                  t_extinf = t_line
                  tid_match = re.search(r'tvg-id="([^"]+)"', t_extinf)
                  t_id = tid_match.group(1).strip() if tid_match else None

                  # പഴയ ഫയലിലെ ഈ ചാനലിന്റെ തുടർന്നുള്ള ലൈനുകൾ വായിക്കുന്നു
                  t_following = []
                  m = k + 1
                  while m < len(target_lines):
                      sub = target_lines[m].strip()
                      if sub.startswith("#EXTINF") or sub.startswith("#KODIPROP:"):
                          break
                      if sub:
                          t_following.append(sub)
                      m += 1

                  # കോമൺ tvg-id സോഴ്സ് ഫയലിൽ ലഭ്യമാണെങ്കിൽ അത് റീപ്ലേസ് ചെയ്യുന്നു
                  if t_id and t_id in source_channel_map:
                      updated_blocks.append(source_channel_map[t_id])
                      replaced_count += 1
                  else:
                      # സോഴ്സിൽ ഇല്ലാത്ത നിങ്ങളുടെ മറ്റ് ചാനലുകൾ അതേപടി മാറ്റമില്ലാതെ നിലനിർത്തുന്നു
                      orig_block = t_props + [t_extinf] + t_following
                      updated_blocks.append("\n".join(orig_block))

                  t_props = []
                  k = m - 1
              else:
                  t_props = []
              k += 1

          final_content = "#EXTM3U\n" + "\n".join(updated_blocks) + "\n"

          with open(TARGET_FILE, "w", encoding="utf-8") as f:
              f.write(final_content)

          print(f"[+] Successfully integrated! Updated {replaced_count} matching channels in {TARGET_FILE}.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plex.m3u
          
          if git diff --staged --quiet; then
            echo "No updates detected. Skipping commit."
          else
            echo "Changes detected, pushing updated playlist..."
            git commit -m "Auto-update playlist [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          fi
