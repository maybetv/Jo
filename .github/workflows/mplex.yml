name: Full Sync & Fix M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Sync and Integrate Matching Channels
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import time
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          SOURCE_URL = "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u"
          IP_MANAGER_URL = "https://game.playindia.fun/Jtv/IP.php?id=RiYlIZ"
          TARGET_FILE = "plex.m3u"

          # 1. IP Manager വഴി പഴയ IP-കൾ പൂർണ്ണമായി ക്ലിയർ ചെയ്യുന്നു
          def clear_old_ips():
              print("[*] Clearing old IPs from IP Manager...")
              session = requests.Session()
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Referer": "https://game.playindia.fun/"
              }
              try:
                  res = session.get(IP_MANAGER_URL, headers=headers, timeout=10)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      forms = soup.find_all('form')
                      ip_list = []
                      for form in forms:
                          action_input = form.find('input', {'name': 'action', 'value': 'delete_ip'})
                          ip_input = form.find('input', {'name': 'ip'})
                          if action_input and ip_input:
                              ip_list.append(ip_input.get('value'))
                      for ip_val in ip_list:
                          try:
                              session.post(IP_MANAGER_URL, data={'action': 'delete_ip', 'ip': ip_val}, headers=headers, timeout=5)
                          except Exception:
                              pass
                      print(f"[+] Cleared {len(ip_list)} old IP(s) successfully!\n")
              except Exception as e:
                  print(f"[-] IP Manager check failed (continuing anyway): {e}")

          clear_old_ips()

          # 2. ടാർഗെറ്റ് ഫയലിൽ നിലവിലുള്ള ചാനലുകളുടെ ഐഡികൾ കണ്ടെത്തുന്നു
          existing_valid_ids = set()
          if os.path.exists(TARGET_FILE):
              with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      if line.startswith("#EXTINF"):
                          tid = re.search(r'tvg-id="([^"]+)"', line)
                          if tid:
                              existing_valid_ids.add(tid.group(1).strip().lower())
                          else:
                              parts = line.strip().split(",")
                              if len(parts) > 1:
                                  existing_valid_ids.add(parts[-1].strip().lower())

          print(f"[*] Found {len(existing_valid_ids)} target channel IDs in {TARGET_FILE}.")

          # 3. Playwright ഉപയോഗിച്ച് സോഴ്സ് ഫയൽ ഡൗൺലോഡ് ചെയ്യുന്നു (Stealth mode)
          raw_source_data = ""
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-infobars",
                      "--window-position=0,0",
                      "--ignore-certifcate-errors",
                      "--ignore-certifcate-errors-spki-list"
                  ]
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()
              
              # Navigator.webdriver ഹൈഡ് ചെയ്യുന്നു
              page.add_init_script("""
                  Object.defineProperty(navigator, 'webdriver', {
                      get: () => undefined
                  });
              """)

              print("[*] Accessing source URL...")
              try:
                  # IP ആക്ടിവേറ്റ് ചെയ്യാൻ ആദ്യം IP മാനേജർ പേജിലേക്ക് പോകുന്നു
                  page.goto(IP_MANAGER_URL, timeout=30000, wait_until="domcontentloaded")
                  time.sleep(2)
                  # തുടർന്ന് പ്ലേലിസ്റ്റ് ഓപ്പൺ ചെയ്യുന്നു
                  page.goto(SOURCE_URL, timeout=60000, wait_until="domcontentloaded")
              except Exception as e:
                  print(f"Navigation warning: {e}")

              # പേജ് പൂർണ്ണമായി ലോഡ് ആകുന്നതിനായി കാത്തിരിക്കുന്നു
              for _ in range(35):
                  page_content = page.content()
                  if "#EXTM3U" in page_content or "#EXTINF" in page_content:
                      break
                  time.sleep(1)

              try:
                  text_content = page.inner_text("body")
                  if "#EXTM3U" in text_content or "#EXTINF" in text_content:
                      raw_source_data = text_content
                  else:
                      raw_source_data = page.content()
              except Exception:
                  raw_source_data = page.content()

              browser.close()

          # HTML ടാഗുകൾ ഒഴിവാക്കുന്നു
          if "<pre>" in raw_source_data and "</pre>" in raw_source_data:
              raw_source_data = raw_source_data.split("<pre>")[1].split("</pre>")[0].strip()

          if "#EXTM3U" not in raw_source_data and "#EXTINF" not in raw_source_data:
              print("[-] Error: Cloudflare bypass failed or empty source response.")
              print("Preview of received content:\n", raw_source_data[:300])
              sys.exit(1)

          # 4. സോഴ്സ് ചാനലുകൾ Parse ചെയ്ത് Map ഉണ്ടാക്കുന്നു
          source_lines = raw_source_data.splitlines()
          source_channel_map = {}
          current_props = []
          i = 0
          while i < len(source_lines):
              line = source_lines[i].strip()
              if not line or line.startswith("#EXTM3U"):
                  i += 1
                  continue

              if line.startswith("#KODIPROP:"):
                  current_props.append(line)
              elif line.startswith("#EXTINF"):
                  extinf_line = line
                  tid_match = re.search(r'tvg-id="([^"]+)"', extinf_line)
                  channel_id = tid_match.group(1).strip() if tid_match else None
                  
                  following_lines = []
                  j = i + 1
                  while j < len(source_lines):
                      sub = source_lines[j].strip()
                      if sub.startswith("#EXTINF") or sub.startswith("#KODIPROP:"):
                          break
                      if sub:
                          following_lines.append(sub)
                      j += 1
                  
                  if channel_id:
                      full_block = current_props + [extinf_line] + following_lines
                      source_channel_map[channel_id.lower()] = "\n".join(full_block)

                  current_props = []
                  i = j - 1
              else:
                  current_props = []
              i += 1

          print(f"[*] Parsed {len(source_channel_map)} channels from source.")

          # 5. പഴയ ഫയലിലെ മാച്ചിങ് ചാനലുകൾ മാത്രം റീപ്ലേസ് ചെയ്യുന്നു
          if not os.path.exists(TARGET_FILE):
              with open(TARGET_FILE, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(source_channel_map.values()))
              print(f"[+] Created fresh {TARGET_FILE}.")
              sys.exit(0)

          with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
              target_lines = f.read().splitlines()

          updated_blocks = []
          t_props = []
          k = 0
          replaced_count = 0

          while k < len(target_lines):
              t_line = target_lines[k].strip()
              if not t_line or t_line.startswith("#EXTM3U"):
                  k += 1
                  continue

              if t_line.startswith("#KODIPROP:"):
                  t_props.append(t_line)
              elif t_line.startswith("#EXTINF"):
                  t_extinf = t_line
                  tid_match = re.search(r'tvg-id="([^"]+)"', t_extinf)
                  t_id = tid_match.group(1).strip().lower() if tid_match else None

                  t_following = []
                  m = k + 1
                  while m < len(target_lines):
                      sub = target_lines[m].strip()
                      if sub.startswith("#EXTINF") or sub.startswith("#KODIPROP:"):
                          break
                      if sub:
                          t_following.append(sub)
                      m += 1

                  # സോഴ്സ് ചാനലുമായി മാച്ച് ആവുന്നുണ്ടെങ്കിൽ മാത്രം റീപ്ലേസ് ചെയ്യുന്നു
                  if t_id and t_id in source_channel_map:
                      updated_blocks.append(source_channel_map[t_id])
                      replaced_count += 1
                  else:
                      orig_block = t_props + [t_extinf] + t_following
                      updated_blocks.append("\n".join(orig_block))

                  t_props = []
                  k = m - 1
              else:
                  t_props = []
              k += 1

          final_content = "#EXTM3U\n" + "\n".join(updated_blocks) + "\n"

          with open(TARGET_FILE, "w", encoding="utf-8") as f:
              f.write(final_content)

          print(f"[+] Successfully integrated! Updated {replaced_count} matching channels in {TARGET_FILE}.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plex.m3u
          
          if git diff --staged --quiet; then
            echo "No updates detected. Skipping commit."
          else
            echo "Changes detected, pushing updated playlist..."
            git commit -m "Auto-update playlist [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          fi
