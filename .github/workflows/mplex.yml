name: Full Sync & Fix M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch and Process PHP Playlist
        run: |
          python - << 'EOF'
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = "https://game.playindia.fun/Jtv/RiYlIZ/Playlist.m3u"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox"
                  ]
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              
              page = context.new_page()
              print("Connecting to URL and waiting for Cloudflare challenge...")
              
              try:
                  page.goto(url, timeout=60000, wait_until="networkidle")
              except Exception as e:
                  print(f"Initial navigation completed or timed out: {e}")

              # Cloudflare challenge പൂർത്തിയാകാൻ പരമാവധി 20 സെക്കൻഡ് വരെ കാത്തിരിക്കുന്നു
              content = ""
              for i in range(20):
                  content = page.content()
                  if "Just a moment..." not in content and ("#EXTM3U" in content or "#EXTINF" in content):
                      break
                  time.sleep(1)

              # പ്ലെയിൻ ടെക്സ്റ്റ് ആയി ലഭിക്കാൻ body ടാഗിന്റെ ടെക്സ്റ്റ് എടുക്കുന്നു
              try:
                  text_content = page.inner_text("body")
                  if "#EXTM3U" in text_content or "#EXTINF" in text_content:
                      content = text_content
              except Exception:
                  pass

              browser.close()

              content = content.strip()

              if "#EXTM3U" not in content and "#EXTINF" not in content:
                  print("Failed to bypass Cloudflare challenge or invalid playlist!")
                  print("Preview:")
                  print(content[:300])
                  sys.exit(1)

              with open("plex.m3u", "w", encoding="utf-8") as f:
                  f.write(content)

              print("Success: Playlist downloaded and saved to plex.m3u!")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plex.m3u
          
          if git diff --staged --quiet; then
            echo "No changes found in playlist. Skipping push."
          else
            echo "Changes detected, pushing new playlist..."
            git commit -m "Auto-update plex.m3u [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
