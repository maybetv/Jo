name: Full Sync M3U Playlist

on:
  schedule:
    # ഓരോ 30 മിനിറ്റിലും റൺ ചെയ്യും
    - cron: '*/30 * * * *'
  workflow_dispatch: # മാനുവലായി 'Run workflow' ക്ലിക്ക് ചെയ്തും ടെസ്റ്റ് ചെയ്യാം

permissions:
  contents: write # റിപോസിറ്ററിയിൽ ഫയൽ സേവ് ചെയ്യാനുള്ള അനുമതി

jobs:
  sync-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch complete playlist data
        run: |
          # കംപ്ലീറ്റ് ഡാറ്റ അതേപടി ഡൗൺലോഡ് ചെയ്ത് plex.m3u ലേക്ക് മാറ്റുന്നു
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/plain, */*" \
            "https://premiumplugx.top/Geo/playlist.php" -o plex.m3u

          # ഫയൽ ശൂന്യമല്ലെന്ന് ഉറപ്പുവരുത്തുന്നു
          if [ ! -s plex.m3u ]; then
            echo "Error: Downloaded file is empty! Check URL or server response."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ഫയൽ ആഡ് ചെയ്യുന്നു
          git add plex.m3u
          
          # മാറ്റങ്ങൾ ഉണ്ടെങ്കിൽ മാത്രം പുഷ് ചെയ്യുന്നു
          if git diff --staged --quiet; then
            echo "No changes in playlist data. Skipping push."
          else
            echo "New updates found, pushing to repository..."
            git commit -m "Auto-synced full playlist from source [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
