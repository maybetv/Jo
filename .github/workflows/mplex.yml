name: Full Sync & Fix M3U Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Sync and Integrate Matching Channels
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import time
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          TARGET_FILE = "plex.m3u"
          IP_MANAGER_URL = "https://game.playindia.fun/Jtv/IP.php?id=RiYlIZ"
          SECRET_URL = os.environ.get("PLAYLIST_URL", "").strip()

          # 1. IP Manager വഴി ഐപി ആക്റ്റീവ് ആക്കുന്നു
          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://game.playindia.fun/"
          }
          try:
              res = session.get(IP_MANAGER_URL, headers=headers, timeout=10)
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, 'html.parser')
                  forms = soup.find_all('form')
                  for form in forms:
                      action_input = form.find('input', {'name': 'action', 'value': 'delete_ip'})
                      ip_input = form.find('input', {'name': 'ip'})
                      if action_input and ip_input:
                          try:
                              session.post(IP_MANAGER_URL, data={'action': 'delete_ip', 'ip': ip_input.get('value')}, headers=headers, timeout=5)
                          except Exception:
                              pass
                  print("[+] IP refreshed via manager.")
          except Exception as e:
              print(f"[-] IP Manager check note: {e}")

          # 2. സോഴ്സ് ലിങ്കിൽ നിന്ന് വിവരങ്ങൾ ശേഖരിക്കുന്നു
          raw_source_data = ""
          candidates = [u for u in [SECRET_URL, "https://game.playindia.fun/Jtv/RiYlIZ/all.m3u"] if u]

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-blink-features=AutomationControlled", "--no-sandbox"]
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  viewport={"width": 1920, "height": 1080}
              )
              page = context.new_page()
              page.add_init_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined});")

              try:
                  page.goto(IP_MANAGER_URL, timeout=25000, wait_until="domcontentloaded")
                  time.sleep(2)
              except Exception:
                  pass

              for url in candidates:
                  try:
                      resp = page.goto(url, timeout=30000, wait_until="domcontentloaded")
                      if resp and resp.status == 404:
                          continue

                      for _ in range(15):
                          txt = page.inner_text("body")
                          if "#EXTM3U" in txt or "#EXTINF" in txt:
                              raw_source_data = txt
                              break
                          time.sleep(1)

                      if raw_source_data:
                          break
                  except Exception:
                      continue

              browser.close()

          # 3. സോഴ്സിലെ ചാനലുകളെ മാപ്പ് ചെയ്യുന്നു
          source_channel_map = {}
          if raw_source_data and ("#EXTM3U" in raw_source_data or "#EXTINF" in raw_source_data):
              lines = raw_source_data.splitlines()
              current_props = []
              idx = 0
              while idx < len(lines):
                  l = lines[idx].strip()
                  if not l or l.startswith("#EXTM3U"):
                      idx += 1
                      continue

                  if l.startswith("#KODIPROP:"):
                      current_props.append(l)
                  elif l.startswith("#EXTINF"):
                      extinf_line = l
                      tid = re.search(r'tvg-id="([^"]+)"', extinf_line)
                      ch_id = tid.group(1).strip().lower() if tid else None

                      next_lines = []
                      j = idx + 1
                      while j < len(lines):
                          nxt = lines[j].strip()
                          if nxt.startswith("#EXTINF") or nxt.startswith("#KODIPROP:"):
                              break
                          if nxt:
                              next_lines.append(nxt)
                          j += 1

                      if ch_id:
                          block = current_props + [extinf_line] + next_lines
                          source_channel_map[ch_id] = "\n".join(block)

                      current_props = []
                      idx = j - 1
                  else:
                      current_props = []
                  idx += 1

          print(f"[*] Fetched {len(source_channel_map)} channels from source.")

          # 4. ടാർഗെറ്റ് ഫയലിലുള്ള (plex.m3u) ചാനലുകൾ മാത്രം സേഫ് ആയി അപ്ഡേറ്റ് ചെയ്യുന്നു
          if not os.path.exists(TARGET_FILE):
              print(f"[-] {TARGET_FILE} not found. Skipping rewrite to prevent data loss.")
              sys.exit(0)

          with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
              target_lines = f.read().splitlines()

          updated_blocks = []
          t_props = []
          k = 0
          replaced_count = 0

          while k < len(target_lines):
              line = target_lines[k].strip()
              if not line or line.startswith("#EXTM3U"):
                  k += 1
                  continue

              if line.startswith("#KODIPROP:"):
                  t_props.append(line)
              elif line.startswith("#EXTINF"):
                  t_extinf = line
                  tid = re.search(r'tvg-id="([^"]+)"', t_extinf)
                  t_id = tid.group(1).strip().lower() if tid else None

                  t_sub = []
                  m = k + 1
                  while m < len(target_lines):
                      sub = target_lines[m].strip()
                      if sub.startswith("#EXTINF") or sub.startswith("#KODIPROP:"):
                          break
                      if sub:
                          t_sub.append(sub)
                      m += 1

                  # മാച്ച് ആകുന്ന ചാനൽ മാത്രം അപ്ഡേറ്റ് ചെയ്യുന്നു
                  if t_id and t_id in source_channel_map:
                      updated_blocks.append(source_channel_map[t_id])
                      replaced_count += 1
                  else:
                      # പഴയ ചാനലുകൾ അതേപടി നിലനിർത്തുന്നു
                      orig_block = t_props + [t_extinf] + t_sub
                      updated_blocks.append("\n".join(orig_block))

                  t_props = []
                  k = m - 1
              else:
                  t_props = []
              k += 1

          final_content = "#EXTM3U\n" + "\n".join(updated_blocks) + "\n"

          with open(TARGET_FILE, "w", encoding="utf-8") as f:
              f.write(final_content)

          print(f"[+] Successfully integrated! Updated {replaced_count} channels in {TARGET_FILE}.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add plex.m3u
          
          if git diff --staged --quiet; then
            echo "No updates detected. Skipping commit."
          else
            echo "Changes detected, pushing updated playlist..."
            git commit -m "Auto-update plex.m3u [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD:main || git push origin HEAD:master || true
          fi
