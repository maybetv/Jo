name: Update Live Events Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: live-events-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Combined Playlist
        run: |
          if [ -f "scripts/combine_m3u.py" ]; then
            python scripts/combine_m3u.py
          else
            python combine_m3u.py
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # മാറ്റങ്ങൾ പുൾ ചെയ്യുന്നതിന് മുൻപ് Zoh.m3u സുരക്ഷിതമായി സ്റ്റേജ് ചെയ്യുന്നു
          git add Zoh.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update live events playlist [skip ci]"

          # റിമോട്ടിലെ മാറ്റങ്ങൾ നിലവിലെ ഫയലുകളെ കേടുവരുത്താതെ സിങ്ക് ചെയ്യുന്നു
          git pull --rebase origin ${{ github.ref_name }}

          git push origin ${{ github.ref_name }}
