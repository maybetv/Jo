name: Update Live Events Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: live-events-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Combined Playlist
        run: |
          python scripts/combine_m3u.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Zoh.m3u

          if git diff --cached --quiet; then
            echo "No changes detected in Zoh.m3u."
            exit 0
          fi

          git commit -m "Auto-update live events in Zoh.m3u [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
